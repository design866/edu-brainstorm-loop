<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="refresh" content="4">
<title>🤖 教育头脑风暴 · 群聊</title><style>
:root{--bg:#eef1f6;--card:#fff;--ink:#222b3d;--mut:#7a8699;--line:#e4e8f0}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;padding:14px;max-width:820px;margin:0 auto}
h1{font-size:18px;margin-bottom:2px;display:flex;align-items:center;gap:8px}
.sub{font-size:12px;color:var(--mut);margin-bottom:12px}
.msg{display:flex;gap:10px;margin-bottom:14px;align-items:flex-start}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.body{flex:1;min-width:0}
.head{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.nm{font-weight:800;font-size:13px}
.rl{font-size:11px;color:var(--mut)}
.tm{font-size:10.5px;color:#a5b0bf;margin-left:auto}
.round{font-size:10px;background:#f0f4fa;color:#5b6b84;border-radius:99px;padding:2px 8px}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:9px 12px;font-size:12.5px;color:#3a4557;line-height:1.6;white-space:pre-wrap;max-height:220px;overflow-y:auto;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.dm-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.dm-card .f{font-weight:700;color:#1d5fa8}
.status-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.bot-chip{font-size:11px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.bot-chip.done{background:#ecfdf5;border-color:#10b981;color:#0b8a5a}
.bot-chip.run{background:#fffbeb;border-color:#f59e0b;color:#b36a05}
</style></head><body>
<h1>💬 教育专家群聊 <span style="font-size:12px;color:var(--mut)">· 实时公开 · 每4秒刷新</span></h1>
<div class="sub">5 位教育专家所有发言实时公开在此群聊 · 修改意见/方案/交付进度均可见</div>
<div class="status-row" id="chips"></div>
<div id="timeline"></div>
<h1 style="margin-top:18px">📄 产出文件</h1>
<div class="sub">机器人写入的方案文件，最新优先</div>
<div id="dmList"></div>
<script>
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
fetch('/api').then(r=>r.json()).then(d=>{
  var ch=document.getElementById('chips'); ch.innerHTML='';
  d.bots.forEach(b=>{
    var st=b.done?'done':b.working?'run':'';
    ch.innerHTML+='<span class="bot-chip '+st+'">'+b.em+' '+b.name+(b.working?' ⚡':b.done?' ✓':'')+'</span>';
  });
  var tl=document.getElementById('timeline'); tl.innerHTML='';
  if(!d.timeline || !d.timeline.length){ tl.innerHTML='<div style="color:var(--mut);font-size:13px">群聊暂无消息…</div>'; }
  d.timeline.forEach(m=>{
    tl.innerHTML+='<div class="msg"><div class="avatar">'+m.em+'</div><div class="body">'+
      '<div class="head"><span class="nm">'+m.name+'</span><span class="rl">'+m.role+'</span>'+
      '<span class="round">'+esc(m.round)+'</span><span class="tm">'+m.time+'</span></div>'+
      '<div class="bubble">'+esc(m.text)+'</div></div></div>';
  });
  var dm=document.getElementById('dmList'); dm.innerHTML='';
  if(d.dm && d.dm.length){
    d.dm.forEach(f=>{ dm.innerHTML+='<div class="dm-card"><span class="f">📄 '+esc(f.name)+'</span><span style="color:var(--mut);font-size:11px">'+f.mtime+' · '+(f.size/1024).toFixed(1)+'KB</span></div>'; });
  } else dm.innerHTML='<div style="color:var(--mut);font-size:12px">暂无产出文件</div>';
}).catch(e=>{document.getElementById('timeline').innerHTML='<div style="color:var(--red)">加载失败: '+e+'</div>'});
</script></body></html>
